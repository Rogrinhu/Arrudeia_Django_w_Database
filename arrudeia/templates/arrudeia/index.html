{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrudeia - Página Inicial</title>
  <link rel="stylesheet" href="{% static 'css/home.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">
  <link rel="icon" href="{% static 'assets/logo colorida 1.png' %}" type="image/x-icon">
  <link rel="shortcut icon" href="{% static 'assets/logo colorida 1.png' %}" type="image/x-icon">
</head>

<body>

  <!-- Botão de tema -->
  <button class="theme-toggle" aria-label="Alternar tema">
    <i class="fas fa-moon"></i>
  </button>

  <header class="header">
    <div class="container header-content">
      <div class="logo">
        <img src="{% static 'assets/logo-arrudeia.png' %}" alt="Arrudeia" class="logo-img">
        <span class="logo-text"><img src="{% static 'assets/arrudeia_branco.png' %}" alt="logo" style="width: 100px;"></span>
      </div>
      <nav class="nav">
        <a href="{% url 'homeoff' %}" class="nav-link active">Início</a>
        <a href="{% url 'feed' %}" class="nav-link">ROTEIROS</a>
        <a href="{% url 'guias' %}" class="nav-link">GUIAS</a>
        <a href="{% url 'eventos' %}" class="nav-link">EVENTOS</a>
        <a href="{% url 'faq' %}" class="nav-link">FAQ</a>
      </nav>
      <div class="user">
        <a href="{% url 'login' %}"></a>
        <img src="{% static 'assets/user-avatar.png' %}" style="width: auto; height: 50px;" alt="User" class="user-avatar">
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">

    <!-- Favoritos -->
    <section class="section" id="favoritos-section">
      <div class="risco">
        <h2 class="section-title">FAVORITOS</h2>
      </div>
      <div class="grid" id="favoritos-grid">
        <!-- Preenchido dinamicamente -->
      </div>
      <p id="empty-favorites" class="empty-message"
        style="display: none; text-align: center; color: #777; margin-top: 1rem;">
        Você ainda não tem favoritos. Clique nos corações para adicionar!
      </p>
    </section>

    <!-- Roteiros -->
    <section class="section">
      <div class="risco">
        <h2 class="section-title">ROTEIROS</h2>
      </div>
      <div class="grid" id="roteiros-grid">
        <!-- Cards gerados via JS -->
      </div>
    </section>

    <!-- Eventos -->
    <section class="section">
      <div class="risco">
        <h2 class="section-title">EVENTOS</h2>
      </div>
      <div class="grid" id="eventos-grid">
        <!-- Cards gerados via JS -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-logo">
        <img src="{% static 'assets/logo-arrudeia.png' %}" alt="Arrudeia" class="footer-logo-img">
      </div>
      <div class="social">
        <a href="#"><img src="{% static 'assets/twitter.png' %}" alt="Twitter"></a>
        <a href="#"><img src="{% static 'assets/facebook.png' %}" alt="Facebook"></a>
        <a href="#"><img src="{% static 'assets/instagram.png' %}" alt="Instagram"></a>
      </div>
      <div class="container footer-patrocinadores">
        <img src="{% static 'assets/logo-senac.png' %}" alt="Patrocinadores" class="footer-patrocinadores-senac">
        <img src="{% static 'assets/logo-gerando-falcoes.png' %}" alt="Patrocinadores" class="footer-patrocinadores-gerando-falcoes">
        <img src="{% static 'assets/logo-serasa-experian.png' %}" alt="Patrocinadores" class="footer-patrocinadores-serasa-experian">
      </div>
    </div>
    <div class="footer-links container">
      <p><b>ARRUDEIA</b> © 2025. Todos os direitos reservados.</p>
    </div>
  </footer>

  <!-- JavaScript -->
  <script>
    // Configuração de caminhos estáticos
    window.STATIC_URL = "{% static '' %}";
    // URLs do Django
    window.URLS = {
      postRoteiros: "{% url 'post_roteiros' %}",
      postEventos: "{% url 'post_eventos' %}"
    };
  </script>
  <script src="{% static 'js/theme_toggle.js' %}"></script>
  <script src="{% static 'js/script_home.js' %}"></script>
</body>

</html>
